# Posts every published release to the Hopzle Toolkit Discord build-log.
# Needs the DISCORD_WEBHOOK repo secret (a Discord channel webhook URL).
# Copy this file + secret into any toolkit repo to get the same announcements.
name: Announce release on Discord

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 - "$GITHUB_EVENT_PATH" <<'EOF'
          import json, os, sys, urllib.request

          ev = json.load(open(sys.argv[1]))
          rel = ev["release"]
          repo = ev["repository"]

          # Keep it brief: first ~350 chars of the release notes.
          body = (rel.get("body") or "").strip()
          if len(body) > 350:
              body = body[:350].rsplit(" ", 1)[0] + " …"

          payload = {
              "embeds": [{
                  "title": f"\U0001F430 {repo['name']} {rel['tag_name']} is out",
                  "url": rel["html_url"],
                  "description": body,
                  "color": 0x16E0D2,
                  "footer": {"text": "Hopzle Toolkit · hopzle.com"},
              }]
          }
          # Strip whitespace and a UTF-8 BOM: a secret set by piping from
          # PowerShell picks up a BOM, and urllib then rejects the URL as
          # "unknown url type: ﻿https".
          webhook = os.environ["WEBHOOK"].strip().lstrip("﻿")

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json",
                       "User-Agent": "hopzle-release-bot"})
          urllib.request.urlopen(req)
          print("posted to Discord")
          EOF
