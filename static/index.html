<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <!-- JSZip CDN for ZIP import -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriggerWord</title>
</head>
<body>
    <h1>TriggerWord</h1>
    
    <div class="controls">
        <label for="audioSource" style="font-weight:600;margin-right:8px;">Audio Input Device:</label>
        <select id="audioSource" style="margin-right:18px;"></select>
        <span id="audioDeviceMsg" style="color:#c62828;font-size:0.97em;margin-right:12px;display:none;"></span>
        <button id="startBtn">Listen for triggers</button>
        <button id="stopBtn" disabled>Stop listening</button>
    </div>
    <div id="status">Status: Ready</div>
    <div>
        <div style="margin-top:10px;">
            <button id="saveTriggers" title="Save your current triggers and setup in your browser for automatic reload next time.">Save in browser</button>
            <button id="loadTriggers" title="Reload the last saved setup from your browser.">Reload Last</button>
            <button id="downloadSetup" title="Export your triggers and setup as a .json file for backup or sharing.">Export Soundpack</button>
            <button id="importSetupBtn" title="Import a soundpack .json file to restore or share setups.">Import Soundpack</button>
            <input type="file" id="importSetup" style="display:none" accept="application/json">
            <!-- ZIP Import UI -->
            <button id="importZipBtn" title="Import a zipped soundpack (.zip) with all audio included.">Import ZIP Soundpack</button>
            <input type="file" id="importZipInput" style="display:none" accept=".zip">
        </div>
        <div id="transcript">Speak to see the transcription here...</div>
    </div>
    <!-- Trigger setup UI -->
    <div id="trigger-setup">
        <details id="triggerSetupPanel" open class="cool-card">
            <summary>🎛️ Trigger Setup</summary>
            <div>
                <form id="triggerForm">
                    <input type="text" id="triggerWord" placeholder="Trigger word/phrase" required>
                    <input type="file" id="triggerSound" accept="audio/*" multiple>
                    <input type="number" id="triggerCooldown" min="1" value="10" style="width:60px;" required> 
                    <label for="triggerCooldown">Cooldown (s)</label>
                    <button type="submit">Add Trigger</button>
                </form>
                <div id="triggerList"></div>
                
            </div>
        </details>
        
    </div>



    <script>
        // DOM Elements
        const startBtn = document.getElementById('startBtn');

        // --- Modal logic for editing card details ---
        async function ensureModalLoaded() {
            if (!document.getElementById('editModal')) {
                // Create basic modal HTML inline since modal.html might not exist
                const modalHTML = `
                    <div id="editModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
                        <div id="editModalContent" style="background:white;padding:20px;border-radius:8px;width:300px;">
                            <h3>Edit Trigger Group</h3>
                            <label>Keywords (comma-separated):</label>
                            <input type="text" id="editModalAliases" style="width:100%;margin:8px 0;">
                            <label>Cooldown (seconds):</label>
                            <input type="number" id="editModalCooldown" min="1" style="width:100%;margin:8px 0;">
                            <div style="margin-top:16px;">
                                <button id="editModalSave">Save</button>
                                <button id="editModalClose">Cancel</button>
                                <button id="editModalDelete" style="background:#d32f2f;color:white;margin-left:10px;">Delete Group</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHTML);
            }
        }

        // ENHANCED openEditModal function with play/test functionality
        async function openEditModal(groupArr, allAliases, cooldown, onDeleteGroup) {
            await ensureModalLoaded();
            const modal = document.getElementById('editModal');
            const aliasesInput = document.getElementById('editModalAliases');
            const cooldownInput = document.getElementById('editModalCooldown');
            const saveBtn = document.getElementById('editModalSave');
            const closeBtn = document.getElementById('editModalClose');
            const deleteBtn = document.getElementById('editModalDelete');
            
            // Get the trigger for testing sounds
            const { trigger } = groupArr[0];
            
            // Populate fields
            aliasesInput.value = allAliases.join(', ');
            cooldownInput.value = cooldown;
            modal.style.display = 'flex';
            
            // Add test/play button if sounds exist
            let testBtn = document.getElementById('editModalTest');
            if (trigger.sounds && trigger.sounds.length > 0 && !testBtn) {
                testBtn = document.createElement('button');
                testBtn.id = 'editModalTest';
                testBtn.textContent = '🔊 Test Sound';
                testBtn.style.marginLeft = '10px';
                testBtn.style.background = '#4caf50';
                testBtn.style.color = 'white';
                testBtn.onclick = async function() {
                    try {
                        const s = trigger.sounds.length === 1 ? 
                            trigger.sounds[0] : 
                            trigger.sounds[Math.floor(Math.random() * trigger.sounds.length)];
                        
                        let audioUrl = null;
                        
                        if (s.blob && s.blob instanceof Blob) {
                            audioUrl = URL.createObjectURL(s.blob);
                        } else if (s.blobKey) {
                            const ab = await getAudioFromDB(s.blobKey);
                            if (ab) {
                                const blob = new Blob([ab], { type: 'audio/wav' });
                                audioUrl = URL.createObjectURL(blob);
                            }
                        }
                        
                        if (audioUrl) {
                            const audio = new Audio(audioUrl);
                            audio.play().catch(err => console.error('Audio play error:', err));
                            audio.onended = () => URL.revokeObjectURL(audioUrl);
                        } else {
                            alert('No audio available to test');
                        }
                    } catch (error) {
                        console.error('Error testing audio:', error);
                        alert('Error playing audio: ' + error.message);
                    }
                };
                
                // Insert test button after save button
                saveBtn.parentNode.insertBefore(testBtn, saveBtn.nextSibling);
            }
            
            // Save handler
            saveBtn.onclick = function() {
                const newAliases = aliasesInput.value.split(',').map(w => w.trim()).filter(Boolean);
                const newCooldown = parseInt(cooldownInput.value, 10) || 10;
                
                // Distribute aliases among triggers
                if (groupArr.length === 1) {
                    groupArr[0].trigger.word = newAliases.join(',');
                    groupArr[0].trigger.cooldown = newCooldown;
                } else {
                    let per = Math.ceil(newAliases.length / groupArr.length);
                    let idxA = 0;
                    groupArr.forEach(({ trigger }) => {
                        trigger.word = newAliases.slice(idxA, idxA + per).join(',');
                        trigger.cooldown = newCooldown;
                        idxA += per;
                    });
                }
                
                saveTriggersToStorage();
                renderTriggerList();
                modal.style.display = 'none';
            };
            
            // Close handlers
            closeBtn.onclick = () => modal.style.display = 'none';
            modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
            
            // Delete group handler
            deleteBtn.onclick = function() {
                if (confirm('Delete this trigger group and all its keywords?')) {
                    modal.style.display = 'none';
                    if (onDeleteGroup) onDeleteGroup();
                }
            };
        }

        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        
        // Audio device selection
        const audioSourceSelect = document.getElementById('audioSource');
        let selectedDeviceId = null;

        async function populateAudioSources() {
            const audioDeviceMsg = document.getElementById('audioDeviceMsg');
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                audioSourceSelect.innerHTML = '';
                audioDeviceMsg.style.display = 'none';
                if (audioInputs.length === 0) {
                    audioSourceSelect.innerHTML = '<option value="">(No devices found)</option>';
                    audioDeviceMsg.textContent = 'No audio input devices found.';
                    audioDeviceMsg.style.display = '';
                } else {
                    audioInputs.forEach(device => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.textContent = device.label || `Microphone ${audioSourceSelect.length + 1}`;
                        audioSourceSelect.appendChild(option);
                    });
                    selectedDeviceId = audioInputs[0].deviceId;
                }
            } catch (e) {
                audioSourceSelect.innerHTML = '<option value="">(No devices found)</option>';
                audioDeviceMsg.textContent = 'Please allow microphone access for device selection.';
                audioDeviceMsg.style.display = '';
            }
        }

        // Audio recording variables
        let mediaRecorder;
        let socket = null;
        let isRecording = false;
        let isPlayingSample = false;
        let stream;
        let pcmBuffer = [];
        let chunkInterval;
        const RECORD_SECONDS = 3;
        const CHUNK_OVERLAP_MS = 500;
        const SAMPLE_RATE = 16000;
        const OVERLAP_SAMPLES = Math.floor((CHUNK_OVERLAP_MS / 1000) * SAMPLE_RATE);
        let overlapBuffer = new Int16Array(0);

        // Trigger setup state
        let triggers = [];
        let triggerAudioElements = {};

        // WebSocket connection for local Whisper server
        let socket = null;
        let isConnected = false;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        const RECONNECT_DELAY = 3000; // 3 seconds

        async function connectWebSocket() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                console.log('WebSocket already connected or connecting');
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            console.log('🔌 Connecting to WebSocket at:', wsUrl);
            
            try {
                socket = new WebSocket(wsUrl);
                isConnected = false;

                socket.onopen = () => {
                    console.log('✅ WebSocket connected to local Whisper server');
                    updateStatus('Connected to Whisper server', 'success');
                    isConnected = true;
                    reconnectAttempts = 0;
                };

                socket.onmessage = (event) => {
                    const message = event.data;
                    console.log('📩 Message from server:', message);
                    
                    if (message === 'connection_established') {
                        console.log('✅ Server confirmed WebSocket connection');
                        return;
                    }
                    
                    if (message.startsWith('trigger:')) {
                        const triggerType = message.split(':')[1];
                        handleTrigger(triggerType);
                    } else if (message.startsWith('error:')) {
                        updateStatus('Server error: ' + message.substring(6), 'error');
                    } else if (message.trim() !== '') {
                        updateTranscript(message);
                    }
                };

                socket.onclose = (event) => {
                    console.log(`❌ WebSocket closed. Code: ${event.code}, Reason: ${event.reason || 'No reason provided'}`);
                    isConnected = false;
                    
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        const delay = RECONNECT_DELAY * Math.pow(1.5, reconnectAttempts - 1);
                        console.log(`🔄 Reconnecting in ${delay/1000} seconds... (Attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                        updateStatus(`Disconnected. Reconnecting in ${Math.ceil(delay/1000)}s...`, 'warning');
                        setTimeout(connectWebSocket, delay);
                    } else {
                        updateStatus('Disconnected from server. Please refresh the page to reconnect.', 'error');
                    }
                };

                socket.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                    updateStatus('Connection error', 'error');
                };

            } catch (error) {
                console.error('❌ WebSocket connection failed:', error);
                updateStatus('Failed to connect to server', 'error');
                if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    reconnectAttempts++;
                    const delay = RECONNECT_DELAY * Math.pow(1.5, reconnectAttempts - 1);
                    console.log(`🔄 Retrying connection in ${delay/1000} seconds... (Attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                    setTimeout(connectWebSocket, delay);
                }
            }
        }

        // Fallback speech recognition setup
        let recognition;
        let isListening = false;
        let useFallback = false;

        function initFallbackRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                updateStatus('Web Speech API not supported in this browser', 'error');
                return false;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                console.log('🎤 Fallback speech recognition started');
                updateStatus('Using browser speech recognition (fallback mode)', 'info');
                isListening = true;
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (finalTranscript) {
                    console.log('🎤 Final transcript (fallback):', finalTranscript);
                    updateTranscript(finalTranscript);
                    checkForTriggers(finalTranscript);
                } else if (interimTranscript) {
                    updateTranscript(interimTranscript);
                }
            };

            recognition.onerror = (event) => {
                console.error('❌ Fallback speech recognition error:', event.error);
                updateStatus('Error with speech recognition: ' + event.error, 'error');
                isListening = false;
            };

            recognition.onend = () => {
                console.log('🎤 Fallback speech recognition ended');
                if (isListening) {
                    recognition.start();
                }
            };

            return true;
        }

        function checkForTriggers(transcript) {
            const text = transcript.toLowerCase();
            triggers.forEach(trigger => {
                if (trigger.aliases.some(alias => text.includes(alias.toLowerCase()))) {
                    handleTrigger(trigger.word);
                }
            });
        }
        
        // Update status display
        function updateStatus(message, type = 'info') {
            const statusText = `Status: ${message}`;
            statusDiv.textContent = statusText;
            
            statusDiv.className = '';
            
            if (type === 'error') {
                statusDiv.style.color = '#d32f2f';
            } else if (type === 'success') {
                statusDiv.style.color = '#388e3c';
            } else if (type === 'warning') {
                statusDiv.style.color = '#f57c00';
            } else {
                statusDiv.style.color = '#1976d2';
            }
        }
        
        // Update transcript display
        function updateTranscript(text) {
            if (!text.trim()) return;
            
            const textNode = document.createTextNode(text + '\n');
            transcriptDiv.insertBefore(textNode, transcriptDiv.firstChild);
            transcriptDiv.scrollTop = 0;
        }
        
        // Handle trigger words
        const triggerCooldowns = {};

        // Helper: normalize trigger words by removing punctuation/apostrophes and lowercasing
        function normalizeWord(word) {
            return word.toLowerCase().replace(/[\p{P}'']/gu, '').trim();
        }

        function getCooldownMs(word) {
            const t = triggers.find(t => normalizeWord(t.word) === normalizeWord(word));
            return ((t && t.cooldown) ? t.cooldown : 10) * 1000;
        }

        function handleTrigger(triggerType) {
            const normType = normalizeWord(triggerType);
            let found = triggers.find(t => normalizeWord(t.word) === normType);
            let message = '';
            let cssClass = '';
            const now = Date.now();
            
            if (found && triggerAudioElements[found.word] && triggerAudioElements[found.word].length > 0) {
                const lastFired = triggerCooldowns[found.word] || 0;
                const cdMs = getCooldownMs(found.word);
                if (now - lastFired < cdMs) {
                    const wait = Math.ceil((cdMs - (now - lastFired)) / 1000);
                    message = `⏳ '${found.word}' on cooldown, wait ${wait}s`;
                    cssClass = 'cooldown-msg';
                } else {
                    triggerCooldowns[found.word] = now;
                    isPlayingSample = true;
                    const arr = triggerAudioElements[found.word];
                    const idx = Math.floor(Math.random() * arr.length);
                    arr[idx].play();
                    setTimeout(() => { isPlayingSample = false; }, arr[idx].duration * 1000 + 200);
                    message = `🔊 Triggered: '${found.word}'`;
                    cssClass = 'triggered-msg';
                }
            } else {
                message = `🔔 Unknown trigger: ${triggerType}`;
            }
            
            const triggerNode = document.createElement('div');
            triggerNode.className = cssClass || 'trigger';
            triggerNode.textContent = message;
            transcriptDiv.insertBefore(triggerNode, transcriptDiv.firstChild);
            transcriptDiv.insertBefore(document.createElement('br'), transcriptDiv.firstChild);
            updateStatus(message, 'success');
        }

        // Update cooldown display
        function updateCooldownDisplay() {
            const now = Date.now();
            triggers.forEach(t => {
                const cdSpan = document.getElementById(`cd-status-${t.word}`);
                if (!cdSpan) return;
                const cdMs = getCooldownMs(t.word);
                const lastFired = triggerCooldowns[t.word] || 0;
                const remaining = Math.max(0, Math.ceil((cdMs - (now - lastFired))/1000));
                if (remaining > 0) {
                    cdSpan.textContent = ` | Cooldown: ${remaining}s`;
                    cdSpan.style.color = '#aaa';
                } else {
                    cdSpan.textContent = ' | Ready';
                    cdSpan.style.color = 'green';
                }
            });
        }
        setInterval(updateCooldownDisplay, 500);

        // Audio recording functions
        let audioContext;
        let scriptNode;
        let input;

        async function startRecording() {
            try {
                connectWebSocket();
                updateStatus('Where should we Listen for Triggers?...');
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                input = audioContext.createMediaStreamSource(stream);
                scriptNode = audioContext.createScriptProcessor(4096, 1, 1);
                scriptNode.onaudioprocess = processAudio;
                input.connect(scriptNode);
                scriptNode.connect(audioContext.destination);
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.classList.add('listening-for-triggers');
                isRecording = true;
                updateStatus('Listening For Triggers...', 'success');
                pcmBuffer = [];
                chunkInterval = setInterval(sendPcmChunk, RECORD_SECONDS * 1000);
            } catch (error) {
                console.error('Error accessing microphone:', error);
                updateStatus('Error accessing microphone: ' + error.message, 'error');
            }
        }

        function processAudio(e) {
            if (!isRecording || isPlayingSample) return;
            const inputData = e.inputBuffer.getChannelData(0);
            let sumSquares = 0;
            for (let i = 0; i < inputData.length; i++) {
                sumSquares += inputData[i] * inputData[i];
            }
            const rms = Math.sqrt(sumSquares / inputData.length);
            if (rms > 0.005) {
                let pcm = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    let s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                pcmBuffer.push(new Int16Array(pcm));
            }
        }

        function sendPcmChunk() {
            if (!isRecording || pcmBuffer.length === 0) return;
            let totalLength = pcmBuffer.reduce((acc, arr) => acc + arr.length, 0);
            let combined = new Int16Array(totalLength);
            let offset = 0;
            for (let arr of pcmBuffer) {
                combined.set(arr, offset);
                offset += arr.length;
            }
            let toSend;
            if (overlapBuffer.length > 0) {
                toSend = new Int16Array(overlapBuffer.length + combined.length);
                toSend.set(overlapBuffer, 0);
                toSend.set(combined, overlapBuffer.length);
            } else {
                toSend = combined;
            }
            if (combined.length >= OVERLAP_SAMPLES) {
                overlapBuffer = combined.slice(combined.length - OVERLAP_SAMPLES);
            } else {
                overlapBuffer = combined.slice();
            }
            pcmBuffer = [];
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(toSend.buffer);
            }
        }

        function stopRecording() {
            if (isRecording) {
                isRecording = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                statusDiv.classList.remove('listening-for-triggers');
                if (chunkInterval) clearInterval(chunkInterval);
                if (scriptNode) scriptNode.disconnect();
                if (input) input.disconnect();
                if (audioContext) audioContext.close();
                if (stream) stream.getTracks().forEach(track => track.stop());
                pcmBuffer = [];
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send("__STOP__");
                    socket.close();
                }
                socket = null;
                updateStatus('Listening Stopped');
            }
        }

        // Trigger management functions
        const triggerForm = document.getElementById('triggerForm');
        const triggerWordInput = document.getElementById('triggerWord');
        const triggerSoundInput = document.getElementById('triggerSound');
        const triggerList = document.getElementById('triggerList');
        const saveTriggersBtn = document.getElementById('saveTriggers');
        const loadTriggersBtn = document.getElementById('loadTriggers');
        const downloadSetupBtn = document.getElementById('downloadSetup');
        const importSetupBtn = document.getElementById('importSetupBtn');
        const importSetupInput = document.getElementById('importSetup');

        // UPDATED renderTriggerList function - Click to play, edit via modal only
        function renderTriggerList() {
            triggerList.innerHTML = '';
            
            if (triggers.length === 0) {
                triggerList.innerHTML = '<p>No triggers added yet. Add some above!</p>';
                return;
            }
            
            // Group triggers by unique sound set
            const groups = {};
            triggers.forEach((trigger, idx) => {
                const key = (trigger.sounds || []).map(s => s.name).sort().join(',');
                if (!groups[key]) groups[key] = [];
                groups[key].push({ trigger: trigger, idx });
            });
            
            // Create grid container
            const grid = document.createElement('div');
            grid.className = 'soundboard-grid';
            
            Object.values(groups).forEach(groupArr => {
                const allAliases = groupArr.flatMap(({ trigger }) => trigger.word.split(',').map(w => w.trim())).filter(Boolean);
                const { trigger } = groupArr[0];
                
                // Create card - clickable for playing sounds
                const card = document.createElement('div');
                card.className = 'soundboard-card';
                card.style.cursor = 'pointer'; // Clickable for playing sounds
                
                // Edit button - ONLY editing interface
                const editBtn = document.createElement('button');
                editBtn.className = 'edit-card-btn';
                editBtn.innerHTML = '✏️';
                editBtn.title = 'Edit this trigger';
                editBtn.style.cursor = 'pointer';
                editBtn.style.padding = '8px';
                editBtn.onclick = function(e) {
                    e.stopPropagation();
                    openEditModal(groupArr, allAliases, trigger.cooldown || 10, () => {
                        // Delete callback
                        for (const { idx } of groupArr.slice().reverse()) {
                            triggers.splice(idx, 1);
                        }
                        saveTriggersToStorage();
                        renderTriggerList();
                    });
                };
                card.appendChild(editBtn);
                
                // Word chips container - display only, no editing
                const wordCell = document.createElement('div');
                wordCell.style.display = 'flex';
                wordCell.style.flexWrap = 'wrap';
                wordCell.style.justifyContent = 'center';
                wordCell.style.marginBottom = '12px';
                wordCell.style.pointerEvents = 'none'; // Prevent clicks on chips from interfering
                
                // Render word chips - display only, no interaction
                allAliases.forEach(alias => {
                    const chip = document.createElement('span');
                    chip.className = 'word-chip';
                    chip.textContent = alias;
                    wordCell.appendChild(chip);
                });
                
                card.appendChild(wordCell);
                
                // Sound count display (optional)
                const soundInfo = document.createElement('div');
                soundInfo.style.fontSize = '0.9em';
                soundInfo.style.color = '#666';
                soundInfo.style.marginBottom = '8px';
                const soundCount = trigger.sounds ? trigger.sounds.length : 0;
                soundInfo.textContent = soundCount === 0 ? 'No sounds' : 
                                       soundCount === 1 ? '1 sound' : 
                                       `${soundCount} sounds`;
                card.appendChild(soundInfo);
                
                // Status indicator
                const statusDiv = document.createElement('div');
                statusDiv.style.position = 'absolute';
                statusDiv.style.left = '10px';
                statusDiv.style.bottom = '7px';
                statusDiv.style.fontSize = '1.1em';
                statusDiv.style.color = '#1b7e2f';
                statusDiv.textContent = 'Ready';
                card.appendChild(statusDiv);
                
                // ADD SOUND PLAYBACK on card click
                card.onclick = async function(e) {
                    // Don't play if clicking the edit button
                    if (e.target.classList.contains('edit-card-btn')) return;
                    
                    try {
                        if (trigger.sounds && trigger.sounds.length > 0) {
                            const s = trigger.sounds.length === 1 ? 
                                trigger.sounds[0] : 
                                trigger.sounds[Math.floor(Math.random() * trigger.sounds.length)];
                            
                            let audioUrl = null;
                            
                            // Handle different audio storage types
                            if (s.blob && s.blob instanceof Blob) {
                                audioUrl = URL.createObjectURL(s.blob);
                            } else if (s.blobKey) {
                                const ab = await getAudioFromDB(s.blobKey);
                                if (ab) {
                                    const blob = new Blob([ab], { type: 'audio/wav' });
                                    audioUrl = URL.createObjectURL(blob);
                                }
                            }
                            
                            if (audioUrl) {
                                const audio = new Audio(audioUrl);
                                audio.play().catch(err => {
                                    console.error('Audio play error:', err);
                                    updateStatus('Error playing audio', 'error');
                                });
                                
                                // Visual feedback
                                card.style.boxShadow = '0 0 16px 4px #ffeb3b, 0 2px 8px rgba(0,0,0,0.1)';
                                card.style.border = '2.5px solid #ffeb3b';
                                setTimeout(() => {
                                    card.style.boxShadow = '0 2px 8px rgba(0,0,0,0.1)';
                                    card.style.border = '2px solid #b0e0e6';
                                }, 500);
                                
                                // Clean up URL after playing
                                audio.onended = () => URL.revokeObjectURL(audioUrl);
                            } else {
                                updateStatus('No audio file found for this trigger', 'warning');
                            }
                        } else {
                            updateStatus('No sounds assigned to this trigger', 'warning');
                        }
                    } catch (error) {
                        console.error('Error playing audio:', error);
                        updateStatus('Error playing audio: ' + error.message, 'error');
                    }
                };
                
                grid.appendChild(card);
            });
            
            triggerList.appendChild(grid);
        }

        // Form submission handler
        triggerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const word = triggerWordInput.value.trim();
            const files = Array.from(triggerSoundInput.files);
            const cooldown = parseInt(document.getElementById('triggerCooldown').value, 10) || 10;
            
            if (!word) return;
            
            let sounds = [];
            for (let file of files) {
                const blobKey = `${word}--${Date.now()}--${file.name}`;
                await saveAudioToDB(blobKey, file);
                sounds.push({ name: file.name, blobKey });
            }
            
            const newTrigger = {
                word,
                sounds,
                cooldown
            };
            
            triggers.push(newTrigger);
            saveTriggersToStorage();
            renderTriggerList();
            triggerForm.reset();
            updateStatus('✅ Trigger added successfully!', 'success');
        });

        // IndexedDB helpers
        function saveAudioToDB(blobKey, file) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('TriggerAudioDB', 1);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('audio')) {
                        db.createObjectStore('audio');
                    }
                };
                request.onsuccess = function(e) {
                    const db = e.target.result;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const tx = db.transaction('audio', 'readwrite');
                        const store = tx.objectStore('audio');
                        store.put(ev.target.result, blobKey);
                        tx.oncomplete = resolve;
                        tx.onerror = reject;
                    };
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                };
                request.onerror = reject;
            });
        }
        
        function getAudioFromDB(blobKey) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('TriggerAudioDB', 1);
                request.onsuccess = function(e) {
                    const db = e.target.result;
                    const tx = db.transaction('audio', 'readonly');
                    const store = tx.objectStore('audio');
                    const getReq = store.get(blobKey);
                    getReq.onsuccess = function(ev) {
                        resolve(ev.target.result);
                    };
                    getReq.onerror = reject;
                };
                request.onerror = reject;
            });
        }
        
        async function deleteAudioFromDBByTrigger(trigger) {
            if (trigger.sounds && trigger.sounds.length > 0) {
                const request = indexedDB.open('TriggerAudioDB', 1);
                request.onsuccess = function(e) {
                    const db = e.target.result;
                    const tx = db.transaction('audio', 'readwrite');
                    const store = tx.objectStore('audio');
                    for (const s of trigger.sounds) {
                        if (s.blobKey) {
                            store.delete(s.blobKey);
                        }
                    }
                    tx.oncomplete = function(){};
                };
            }
        }

        // Save/load triggers from localStorage
        function saveTriggersToStorage() {
            localStorage.setItem('triggers', JSON.stringify(triggers));
        }

        async function loadTriggersFromStorage() {
            const raw = localStorage.getItem('triggers');
            if (!raw) return;
            
            try {
                triggers = JSON.parse(raw);
                // Load audio for each trigger
                for (const trigger of triggers) {
                    if (trigger.word) {
                        const audioArr = [];
                        if (trigger.sounds && trigger.sounds.length > 0) {
                            for (const s of trigger.sounds) {
                                // Handle different blob types
                                if (s.blob && s.blob instanceof Blob) {
                                    const url = URL.createObjectURL(s.blob);
                                    const audio = new Audio(url);
                                    audioArr.push(audio);
                                } else if (s.blobKey) {
                                    const ab = await getAudioFromDB(s.blobKey);
                                    if (ab) {
                                        const blob = new Blob([ab], { type: 'audio/wav' });
                                        const url = URL.createObjectURL(blob);
                                        const audio = new Audio(url);
                                        audioArr.push(audio);
                                    }
                                }
                            }
                        }
                        triggerAudioElements[trigger.word] = audioArr;
                    }
                }
            } catch (error) {
                console.error('Error loading triggers from storage:', error);
                triggers = [];
                updateStatus('Error loading saved triggers', 'error');
            }
        }

        // ZIP Import Logic
        const importZipBtn = document.getElementById('importZipBtn');
        const importZipInput = document.getElementById('importZipInput');
        importZipBtn.addEventListener('click', () => {
            importZipInput.click();
        });
        
        importZipInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            updateStatus('Importing ZIP soundpack...');
            
            try {
                const zip = await JSZip.loadAsync(file);
                const manifestFile = zip.file('soundpack.json');
                if (!manifestFile) throw new Error('soundpack.json not found in zip!');
                
                const manifestText = await manifestFile.async('text');
                const manifest = JSON.parse(manifestText);

                // Map of filename -> Blob
                const audioBlobs = {};
                for (const [path, zipObj] of Object.entries(zip.files)) {
                    if (path.endsWith('.mp3') || path.endsWith('.wav') || path.endsWith('.ogg')) {
                        audioBlobs[path] = await zipObj.async('blob');
                    }
                }

                // Map manifest to triggers and attach blobs
                triggers = manifest.map(t => ({
                    ...t,
                    sounds: (t.sounds || []).map(s => ({
                        ...s,
                        blob: audioBlobs[s.name] || null
                    }))
                }));

                saveTriggersToStorage();
                renderTriggerList();
                updateStatus('✅ ZIP soundpack imported!', 'success');
            } catch (err) {
                console.error('ZIP import error:', err);
                updateStatus('❌ Failed to import ZIP: ' + err.message, 'error');
            }
        });

        // Button event listeners
        saveTriggersBtn.addEventListener('click', () => {
            saveTriggersToStorage();
            updateStatus('✅ Trigger setup saved!', 'success');
        });

        loadTriggersBtn.addEventListener('click', async () => {
            await loadTriggersFromStorage();
            renderTriggerList();
            if (!triggers || triggers.length === 0) {
                updateStatus('No saved setup found in browser.', 'warning');
            } else {
                updateStatus('✅ Trigger setup loaded!', 'success');
            }
        });

        downloadSetupBtn.textContent = 'Export Soundpack';
        downloadSetupBtn.addEventListener('click', () => {
            if (triggers.length === 0) {
                updateStatus('No triggers to export', 'warning');
                return;
            }
            
            const data = JSON.stringify(triggers, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'TriggerWord-Soundpack.json';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            updateStatus('✅ Soundpack exported!', 'success');
        });

        importSetupBtn.textContent = 'Import Soundpack';
        importSetupBtn.addEventListener('click', () => {
            importSetupInput.click();
        });

        importSetupInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (!Array.isArray(imported)) throw new Error('Invalid format - expected array');
                    
                    imported.forEach(t => {
                        if (!t.word) throw new Error('Missing word in trigger');
                    });
                    
                    triggers = imported;
                    saveTriggersToStorage();
                    renderTriggerList();
                    updateStatus('✅ Soundpack imported successfully!', 'success');
                } catch (err) {
                    console.error('Import error:', err);
                    updateStatus('❌ Failed to import: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            // First try to connect to local Whisper server
            connectWebSocket().then(() => {
                // If WebSocket connection fails, fall back to browser speech recognition
                setTimeout(() => {
                    if (!isConnected) {
                        console.warn('⚠️ Could not connect to local Whisper server, falling back to browser speech recognition');
                        useFallback = true;
                        if (initFallbackRecognition()) {
                            console.log('✅ Fallback speech recognition initialized');
                        }
                    }
                }, 3000); // Wait 3 seconds to see if WebSocket connects
            });
        });

        // Event listeners
        startBtn.addEventListener('click', () => {
            if (isConnected) {
                startRecording();
            } else if (useFallback && recognition) {
                startFallbackRecognition();
            } else {
                updateStatus('Not connected to any recognition service', 'error');
            }
        });
        
        stopBtn.addEventListener('click', () => {
            if (isConnected) {
                stopRecording();
            } else if (useFallback && recognition) {
                stopFallbackRecognition();
            }
        });
        
        function startFallbackRecognition() {
            if (!recognition && !initFallbackRecognition()) {
                updateStatus('Speech recognition not available', 'error');
                return;
            }
            
            try {
                recognition.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                updateStatus('Listening (browser mode)...', 'info');
            } catch (error) {
                console.error('❌ Error starting fallback recognition:', error);
                updateStatus('Error starting speech recognition', 'error');
            }
        }
        
        function stopFallbackRecognition() {
            if (recognition) {
                isListening = false;
                recognition.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
                updateStatus('Ready', 'info');
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', async () => {
            updateStatus('Initializing...');
            try {
                await populateAudioSources();
                await loadTriggersFromStorage();
                renderTriggerList();
                updateStatus('Ready');
            } catch (error) {
                console.error('Initialization error:', error);
                updateStatus('Initialization error: ' + error.message, 'error');
            }
        });

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (socket) {
                socket.close();
            }
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
        });
    </script>
</body>
</html>
