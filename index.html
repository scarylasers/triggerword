<!DOCTYPE html>
<html>
<head>
  <title>TriggerWord Tester</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    #log { white-space: pre-wrap; font-size: 0.9em; background: #111; color: #0f0; padding: 10px; border-radius: 5px; height: 200px; overflow-y: auto; }
    #transcription { font-size: 1.2em; margin-top: 20px; padding: 10px; background: white; border: 1px solid #ccc; border-radius: 5px; }
    select, button { padding: 8px; margin: 5px; }
  </style>
</head>
<body>
  <h2>🎤 TriggerWord Tester</h2>
  <button onclick="startTriggerWord()">Start Listening</button>
  <p><strong>Status:</strong> <span id="status">Idle</span></p>

  <div id="transcription">Transcript will appear here...</div>
  <h4>Debug Log:</h4>
  <div id="log"></div>

  <script>
    const wsUrl = "wss://scarylasers--triggerword-whisper-fastapi-app-dev.modal.run/ws";
    let ws;

    function log(msg) {
      const logEl = document.getElementById("log");
      logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function startTriggerWord() {
      document.getElementById("status").innerText = "Connecting...";
      ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const recorder = new MediaRecorder(stream, { mimeType: "audio/webm" });

      ws.onopen = () => {
        document.getElementById("status").innerText = "Connected";
        log("🌐 WebSocket connected");
        recorder.start(1000); // 1s chunks
        log("🎙️ MediaRecorder started");
      };

      recorder.ondataavailable = (e) => {
        if (e.data.size > 0 && ws.readyState === 1) {
          ws.send(e.data);
          log("📤 Sent audio blob to Modal");
        }
      };

      ws.onmessage = (e) => {
        const msg = e.data.trim();
        log(`📨 Received: ${msg}`);

        if (msg.startsWith("trigger:")) {
          const trigger = msg.split(":")[1];
          if (trigger === "letsgo") new Audio("letsgo.mp3").play();
          if (trigger === "cute") new Audio("cute.mp3").play();
        } else {
          document.getElementById("transcription").innerText = msg;
        }
      };

      ws.onerror = (err) => log("❌ WebSocket error: " + err.message);
    }
  </script>
</body>
</html>
