<!DOCTYPE html>
<html>
<head>
  <title>TriggerWord Listener</title>
</head>
<body>
  <h1>🎤 TriggerWord Listening Test</h1>

  <label for="mic-select">Select Microphone:</label>
  <select id="mic-select"></select>
  <br><br>

  <button id="start">Start Listening</button>
  <button id="stop" disabled>Stop Listening</button>

  <div id="output"></div>

  <script>
    let socket;
    let mediaRecorder;
    let audioStream;

    const micSelect = document.getElementById("mic-select");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const output = document.getElementById("output");

    // Get available audio input devices
    async function populateMicList() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(device => device.kind === "audioinput");

      micSelect.innerHTML = "";
      mics.forEach((mic, index) => {
        const option = document.createElement("option");
        option.value = mic.deviceId;
        option.text = mic.label || `Microphone ${index + 1}`;
        micSelect.appendChild(option);
      });
    }

    // Ask for mic permissions early so labels show up
    navigator.mediaDevices.getUserMedia({ audio: true }).then(populateMicList);

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      output.innerText = "🎧 Listening...";

      const selectedMicId = micSelect.value;
      audioStream = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: selectedMicId ? { exact: selectedMicId } : undefined }
      });

      mediaRecorder = new MediaRecorder(audioStream, { mimeType: "audio/webm" });
      socket = new WebSocket("wss://scarylasers--triggerword-whisper-fastapi-app.modal.run/ws");

      socket.onmessage = (event) => {
        const text = event.data;
        console.log("🔊", text);
        output.innerText = "🧠 " + text;
      };

      socket.onerror = (e) => {
        console.error("❌ WebSocket error:", e);
        output.innerText = "WebSocket error. Check console.";
        stopListening();
      };

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0 && socket.readyState === WebSocket.OPEN) {
          socket.send(e.data);
        }
      };

      mediaRecorder.start(250);
    };

    stopBtn.onclick = () => stopListening();

    function stopListening() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
      if (socket && socket.readyState === WebSocket.OPEN) socket.close();

      output.innerText = "🛑 Stopped listening.";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
  </script>
</body>
</html>
