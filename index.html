<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriggerWord</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #stopBtn {
            background-color: #f44336;
        }
        #stopBtn:hover {
            background-color: #d32f2f;
        }
        #status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 4px;
            min-height: 24px;
        }
        .recording {
            background-color: #ffebee;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        #transcript {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 100px;
            text-align: left;
            background-color: white;
            white-space: pre-wrap;
        }
        .trigger {
            color: #e91e63;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>TriggerWord</h1>
    
    <div class="controls">
        <button id="startBtn">Listen for triggers</button>
        <button id="stopBtn" disabled>Stop listening</button>
    </div>

    <!-- Trigger setup UI -->
    <div id="trigger-setup">
        <h3>Trigger Words & Sounds</h3>
        <form id="triggerForm">
            <input type="text" id="triggerWord" placeholder="Trigger word/phrase" required>
            <input type="file" id="triggerSound" accept="audio/*">
            <input type="number" id="triggerCooldown" min="1" value="10" style="width:60px;" required> <label for="triggerCooldown">Cooldown (s)</label>
            <button type="submit">Add Trigger</button>
        </form>
        <table id="triggerTable" style="width:100%; border-collapse:collapse; margin-top:10px;">
            <thead>
                <tr>
                    <th style="border-bottom:1px solid #ccc;">Word</th>
                    <th style="border-bottom:1px solid #ccc;">Sound</th>
                    <th style="border-bottom:1px solid #ccc;">Cooldown (s)</th>
                    <th style="border-bottom:1px solid #ccc;">Status</th>
                    <th style="border-bottom:1px solid #ccc;">Play</th>
                    <th style="border-bottom:1px solid #ccc;">Remove</th>
                </tr>
            </thead>
            <tbody id="triggerList"></tbody>
        </table>
        <button id="saveTriggers">Save Setup</button>
        <button id="loadTriggers">Load Setup</button>
        <button id="downloadSetup">Download Setup</button>
        <input type="file" id="importSetup" accept="application/json" style="display:none;">
        <button id="importSetupBtn">Import Setup</button>
    </div>

    <div id="status">Status: Ready</div>
    
    <div>
        <h3>Transcript:</h3>
        <div id="transcript">Speak to see the transcription here...</div>
    </div>

    <script>
        // DOM Elements
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        
        // Audio recording variables
        let mediaRecorder;
        let socket = null;
        let isRecording = false;
        let isPlayingSample = false; // Mute listener when playing sample
        const RECORD_SECONDS = 3; // Length of each audio chunk in seconds (increased for accuracy)

        // Trigger setup state
        let triggers = [];
        let triggerAudioElements = {}; // Map trigger word to audio element for playback

        // Open WebSocket only when recording starts
        // (Best practice: do not call this globally or on page load)
        function connectWebSocket() {
            const wsUrl = 'wss://scarylasers--triggerword-whisper-fastapi-app.modal.run/ws';
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log('WebSocket connected');
                updateStatus('Connected to server', 'info');
                // Send triggers config as first message
                const configMsg = {
                    type: "config",
                    triggers: triggers.map(t => ({word: t.word, sound: t.soundName}))
                };
                socket.send(JSON.stringify(configMsg));
            };

            socket.onmessage = (event) => {
                const message = event.data;
                console.log('Message from server:', message);
                // Handle trigger message from backend
                if (message.startsWith('trigger:')) {
                    const triggerType = message.split(':')[1];
                    handleTrigger(triggerType);
                } else if (message.startsWith('error:')) {
                    updateStatus('Error: ' + message.substring(6), 'error');
                } else {
                    updateTranscript(message);
                }
            };
            
            socket.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus('Disconnected from server', 'warning');
                
                // Try to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
            
            socket.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('Connection error', 'error');
            };
        }
        
        // Initialize WebSocket connection when the page loads
        //connectWebSocket();
        
        // Update status display
        function updateStatus(message, type = 'info') {
            const statusText = `Status: ${message}`;
            statusDiv.textContent = statusText;
            
            // Clear previous classes
            statusDiv.className = '';
            
            // Add appropriate class based on message type
            if (type === 'error') {
                statusDiv.style.color = '#d32f2f';
            } else if (type === 'success') {
                statusDiv.style.color = '#388e3c';
            } else if (type === 'warning') {
                statusDiv.style.color = '#f57c00';
            } else {
                statusDiv.style.color = '#1976d2';
            }
        }
        
        // Update transcript display
        function updateTranscript(text) {
            if (!text.trim()) return;
            
            // Add new text to the transcript
            const textNode = document.createTextNode(text + '\n');
            transcriptDiv.insertBefore(textNode, transcriptDiv.firstChild);
            
            // Scroll to the top to show the latest text
            transcriptDiv.scrollTop = 0;
        }
        
        // Handle trigger words (play sound, mute listener)
        // Track cooldowns for each trigger word
        const triggerCooldowns = {}; // {word: timestamp}
        function getCooldownMs(word) {
            const t = triggers.find(t => t.word === word);
            return ((t && t.cooldown) ? t.cooldown : 10) * 1000;
        }

        function handleTrigger(triggerType) {
            // Normalize both triggerType and stored words for comparison
            const normType = triggerType.toLowerCase().trim();
            let found = triggers.find(t => t.word === normType);
            let message = '';
            const now = Date.now();
            if (found && triggerAudioElements[found.word]) {
                // Cooldown check
                const lastFired = triggerCooldowns[found.word] || 0;
                const cdMs = getCooldownMs(found.word);
                if (now - lastFired < cdMs) {
                    message = `⏳ Trigger '${found.word}' is on cooldown.`;
                } else {
                    triggerCooldowns[found.word] = now;
                    isPlayingSample = true;
                    triggerAudioElements[found.word].play();
                    triggerAudioElements[found.word].onended = () => {
                        isPlayingSample = false;
                    };
                    message = `🔔 Triggered: ${found.word}`;
                }
            } else {
                message = `🔔 Unknown trigger: ${triggerType}`;
            }
            // Add trigger message to transcript
            const triggerNode = document.createElement('div');
            triggerNode.className = 'trigger';
            triggerNode.textContent = message;
            transcriptDiv.insertBefore(triggerNode, transcriptDiv.firstChild);
            transcriptDiv.insertBefore(document.createElement('br'), transcriptDiv.firstChild);
            // Also show in status
            updateStatus(message, 'success');
        }

        // Update cooldown display in trigger list
        function updateCooldownDisplay() {
            const now = Date.now();
            triggers.forEach(t => {
                const cdSpan = document.getElementById(`cd-status-${t.word}`);
                if (!cdSpan) return;
                const cdMs = getCooldownMs(t.word);
                const lastFired = triggerCooldowns[t.word] || 0;
                const remaining = Math.max(0, Math.ceil((cdMs - (now - lastFired))/1000));
                if (remaining > 0) {
                    cdSpan.textContent = ` | Cooldown: ${remaining}s`;
                    cdSpan.style.color = '#aaa';
                } else {
                    cdSpan.textContent = ' | Ready';
                    cdSpan.style.color = 'green';
                }
            });
        }
        setInterval(updateCooldownDisplay, 500); // update every 0.5s

        
        // Start recording
        let audioContext;
        let scriptNode;
        let input;

        async function startRecording() {
            try {
                // Open WebSocket connection only when starting recording (resource/cost saving)
                connectWebSocket();
                updateStatus('Requesting microphone access...');
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                input = audioContext.createMediaStreamSource(stream);
                scriptNode = audioContext.createScriptProcessor(4096, 1, 1);
                scriptNode.onaudioprocess = processAudio;
                input.connect(scriptNode);
                scriptNode.connect(audioContext.destination);
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.classList.add('recording');
                isRecording = true;
                updateStatus('Recording...', 'success');
                pcmBuffer = [];
                chunkInterval = setInterval(sendPcmChunk, RECORD_SECONDS * 1000);
            } catch (error) {
                console.error('Error accessing microphone:', error);
                updateStatus('Error accessing microphone: ' + error.message, 'error');
            }
        }

        function processAudio(e) {
            if (!isRecording || isPlayingSample) return; // Mute listener when sample is playing
            const inputData = e.inputBuffer.getChannelData(0);
            // Silence detection: calculate RMS (root mean square)
            let sumSquares = 0;
            for (let i = 0; i < inputData.length; i++) {
                sumSquares += inputData[i] * inputData[i];
            }
            const rms = Math.sqrt(sumSquares / inputData.length);
            // Only buffer if above threshold (0.005) to save compute and improve UX, but less aggressive
            if (rms > 0.005) {
                let pcm = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    let s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                pcmBuffer.push(new Int16Array(pcm));
            }
        }

        function sendPcmChunk() {
            if (!isRecording || pcmBuffer.length === 0) return;
            // Concatenate all PCM chunks
            let totalLength = pcmBuffer.reduce((acc, arr) => acc + arr.length, 0);
            let combined = new Int16Array(totalLength);
            let offset = 0;
            for (let arr of pcmBuffer) {
                combined.set(arr, offset);
                offset += arr.length;
            }
            pcmBuffer = [];
            // Send as ArrayBuffer
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(combined.buffer);
            }
        }

        function stopRecording() {
            isRecording = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.classList.remove('recording');
            if (chunkInterval) clearInterval(chunkInterval);
            if (scriptNode) scriptNode.disconnect();
            if (input) input.disconnect();
            if (audioContext) audioContext.close();
            if (stream) stream.getTracks().forEach(track => track.stop());
            pcmBuffer = [];
            updateStatus('Recording stopped');
        }

        // Stop recording
        function stopRecording() {
            if (isRecording) {
                isRecording = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                statusDiv.classList.remove('recording');
                // Send stop signal to backend for immediate cleanup and cost savings
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send("__STOP__");
                    // Close the socket to free backend resources
                    socket.close();
                }
                socket = null;
            }
        }

        // Trigger form logic
        const triggerForm = document.getElementById('triggerForm');
        const triggerWordInput = document.getElementById('triggerWord');
        const triggerSoundInput = document.getElementById('triggerSound');
        const triggerList = document.getElementById('triggerList');
        const saveTriggersBtn = document.getElementById('saveTriggers');
        const loadTriggersBtn = document.getElementById('loadTriggers');

        function renderTriggerList() {
            triggerList.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Word</th>
                            <th>Sound</th>
                            <th>Cooldown</th>
                            <th>Status</th>
                            <th>Play</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
        }
        socket = null;
    }
}

// Trigger form logic
const triggerForm = document.getElementById('triggerForm');
const triggerWordInput = document.getElementById('triggerWord');
const triggerSoundInput = document.getElementById('triggerSound');
const triggerList = document.getElementById('triggerList');
const saveTriggersBtn = document.getElementById('saveTriggers');
const loadTriggersBtn = document.getElementById('loadTriggers');

function renderTriggerList() {
    const tbody = document.getElementById('trigger-list-body');
    tbody.innerHTML = '';
    triggers.forEach((t, idx) => {
        const row = document.createElement('tr');
        // Word
        const wordCell = document.createElement('td');
        wordCell.textContent = t.word;
        row.appendChild(wordCell);
        // Sound
        const soundCell = document.createElement('td');
        soundCell.textContent = t.soundName || 'No sound';
        row.appendChild(soundCell);
        // Cooldown
        const cdCell = document.createElement('td');
        cdCell.textContent = t.cooldown || 10;
        row.appendChild(cdCell);
        // Status
        const statusCell = document.createElement('td');
        const cdSpan = document.createElement('span');
        cdSpan.id = `cd-status-${t.word}`;
        statusCell.appendChild(cdSpan);
        row.appendChild(statusCell);
        // Play button
        const playCell = document.createElement('td');
        const playBtn = document.createElement('button');
        playBtn.textContent = '▶️';
        playBtn.disabled = !triggerAudioElements[t.word];
        playBtn.onclick = () => {
            if (triggerAudioElements[t.word]) {
                triggerAudioElements[t.word].play();
            }
        };
        playCell.appendChild(playBtn);
        row.appendChild(playCell);
        // Remove button
        const removeCell = document.createElement('td');
        const removeBtn = document.createElement('button');
        removeBtn.textContent = '❌';
        removeBtn.onclick = async () => {
            triggers.splice(idx, 1);
            await deleteAudioFromDB(t.word);
            saveTriggersToStorage();
            renderTriggerList();
        };
        removeCell.appendChild(removeBtn);
        row.appendChild(removeCell);
        tbody.appendChild(row);
    });
}

        // Remove button
        const removeCell = document.createElement('td');
        const removeBtn = document.createElement('button');
        removeBtn.textContent = '❌';
        removeBtn.onclick = async () => {
            triggers.splice(idx, 1);
            await deleteAudioFromDB(t.word);
            saveTriggersToStorage();
            renderTriggerList();
        };
        removeCell.appendChild(removeBtn);
        row.appendChild(removeCell);
        triggerList.appendChild(row);
    });
}

triggerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    // Always store trigger words as lowercase and trimmed
    const word = triggerWordInput.value.trim().toLowerCase();
    const file = triggerSoundInput.files[0];
    const cooldown = parseInt(document.getElementById('triggerCooldown').value, 10) || 10;
    if (!word) return;
    let soundName = '';
    if (file) {
        soundName = file.name;
        await saveAudioToDB(word, file);
        const blob = await getAudioFromDB(word);
        if (blob) {
            const url = URL.createObjectURL(blob);
            triggerAudioElements[word] = new Audio(url);
        }
    } else {
        triggerAudioElements[word] = null;
        await deleteAudioFromDB(word);
    }
    triggers.push({word, soundName, cooldown});
    renderTriggerList();
    saveTriggersToStorage();
    triggerForm.reset();
});

saveTriggersBtn.addEventListener('click', () => {
    saveTriggersToStorage();
    updateStatus('✅ Trigger setup saved!', 'success');
});

loadTriggersBtn.addEventListener('click', () => {
    loadTriggersFromStorage();
    updateStatus('Trigger setup loaded!', 'success');
});

downloadSetupBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(triggers, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'trigger_setup.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 100);
});

importSetupBtn.addEventListener('click', () => {
    importSetupInput.click();
});
importSetupInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const imported = JSON.parse(evt.target.result);
            if (!Array.isArray(imported)) throw new Error('Invalid format');
            // Validate minimal trigger structure
            imported.forEach(t => {
                if (!t.word) throw new Error('Missing word in trigger');
            });
            triggers = imported;
            saveTriggersToStorage();
            renderTriggerList();
            updateStatus('✅ Setup imported!', 'success');
        } catch (err) {
            updateStatus('❌ Failed to import: ' + err.message, 'error');
        }
    };
    reader.readAsText(file);
});

// IndexedDB audio persistence helpers
const DB_NAME = 'triggerword-audio';
const DB_VERSION = 1;
const STORE_NAME = 'audiofiles';
let db;
function openAudioDB() {
    return new Promise((resolve, reject) => {
        if (db) return resolve(db);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => { db = req.result; resolve(db); };
        req.onupgradeneeded = () => {
            req.result.createObjectStore(STORE_NAME);
        };
    });
}
function saveAudioToDB(key, file) {
    return openAudioDB().then(db => {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(file, key);
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
        });
    });
}
function getAudioFromDB(key) {
    return openAudioDB().then(db => {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    });
}
function deleteAudioFromDB(key) {
    return openAudioDB().then(db => {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).delete(key);
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
        });
    });
}

// Save/load triggers from localStorage (persist cooldown, soundName, word)
function saveTriggersToStorage() {
    localStorage.setItem('triggers', JSON.stringify(triggers));
}
async function loadTriggersFromStorage() {
    const data = localStorage.getItem('triggers');
    if (data) {
        triggers = JSON.parse(data);
        // Restore audio elements from IndexedDB
        for (const t of triggers) {
            if (t.soundName) {
                const blob = await getAudioFromDB(t.word);
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    triggerAudioElements[t.word] = new Audio(url);
                } else {
                    triggerAudioElements[t.word] = null;
                }
            } else {
                triggerAudioElements[t.word] = null;
            }
        }
        });

        renderTriggerList();

        // Event listeners
        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (socket) {
                socket.close();
            }
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
        });
    </script>
</body>
