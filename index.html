<!DOCTYPE html>
<html>
<head>
  <title>TriggerWord Listener</title>
</head>
<body>
  <h1>🎤 TriggerWord Listening Test</h1>

  <label for="mic-select">Select Microphone:</label>
  <select id="mic-select"></select>
  <br><br>

  <button id="start">Start Listening</button>
  <button id="stop" disabled>Stop Listening</button>

  <div id="output"></div>
  <canvas id="mic-meter" width="300" height="30" style="border: 1px solid #ccc; margin-top: 10px;"></canvas>

  <script>
    let socket;
    let mediaRecorder;
    let audioStream;
    let audioContext, analyser, micSource, animationId;

    const micSelect = document.getElementById("mic-select");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const output = document.getElementById("output");
    const canvas = document.getElementById("mic-meter");
    const canvasCtx = canvas.getContext("2d");

    // Get available audio input devices
    async function populateMicList() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(device => device.kind === "audioinput");

      micSelect.innerHTML = "";
      mics.forEach((mic, index) => {
        const option = document.createElement("option");
        option.value = mic.deviceId;
        option.text = mic.label || `Microphone ${index + 1}`;
        micSelect.appendChild(option);
      });
    }

    // Ask for mic permissions early so labels show up
    navigator.mediaDevices.getUserMedia({ audio: true }).then(populateMicList);

    startBtn.onclick = async () => {
      try {
        startBtn.disabled = true;
        stopBtn.disabled = false;
        output.innerText = "🎧 Listening...";

        const selectedMicId = micSelect.value;
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: { deviceId: selectedMicId ? { exact: selectedMicId } : undefined }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();

        micSource = audioContext.createMediaStreamSource(audioStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        micSource.connect(analyser);

        function drawMeter() {
          const bufferLength = analyser.frequencyBinCount;
          const dataArray = new Uint8Array(bufferLength);
          analyser.getByteFrequencyData(dataArray);
          const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;

          canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
          canvasCtx.fillStyle = "limegreen";
          canvasCtx.fillRect(0, 0, avg * 3, canvas.height);

          animationId = requestAnimationFrame(drawMeter);
        }
        drawMeter();

        mediaRecorder = new MediaRecorder(audioStream, { mimeType: "audio/webm" });

        socket = new WebSocket("wss://scarylasers--triggerword-whisper-fastapi-app.modal.run/ws");

        socket.onopen = () => {
          console.log("✅ WebSocket connected");
        };

        socket.onmessage = (event) => {
          const text = event.data;
          console.log("🔊 Transcription:", text);
          output.innerText = "🧠 " + text;
        };

        socket.onerror = (e) => {
          console.error("❌ WebSocket error:", e);
          output.innerText = "WebSocket error occurred.";
          stopListening();
        };

        socket.onclose = (event) => {
          console.warn("🔌 WebSocket closed:", event);
          if (!stopBtn.disabled) {
            output.innerText = "🔌 Connection lost.";
          }
        };

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0 && socket.readyState === WebSocket.OPEN) {
            console.log(`📦 Sending audio chunk: ${e.data.size} bytes`);
            socket.send(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          console.log("🛑 MediaRecorder stopped");
        };

        mediaRecorder.onerror = (e) => {
          console.error("❌ MediaRecorder error:", e);
          output.innerText = "Recording error occurred.";
        };

        // Record in 3-second chunks to get complete WebM segments
        mediaRecorder.start(3000);
      } catch (err) {
        console.error("🚫 Error starting listener:", err);
        output.innerText = "Failed to start listening.";
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    };

    stopBtn.onclick = () => stopListening();

    function stopListening() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
      if (socket && socket.readyState === WebSocket.OPEN) socket.close();

      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      cancelAnimationFrame(animationId);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      output.innerText = "🛑 Stopped listening.";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
  </script>
</body>
</html>
